name: Publish to npm
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest

    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
        
      - name: Ensure no npm token auth is present
        run: |
          echo "Checking for injected npm auth..."
          npm config delete //registry.npmjs.org/:_authToken || true
          rm -f ~/.npmrc || true
          rm -f "$NPM_CONFIG_USERCONFIG" || true
          rm -f /home/runner/work/_temp/.npmrc || true
          npm config list

      - name: Debug OIDC claims (safe)
        shell: bash
        run: |
          set -euo pipefail

          echo "== GitHub context =="
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_JOB=$GITHUB_JOB"
          echo "GITHUB_ACTOR=$GITHUB_ACTOR"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo

          echo "== Requesting OIDC token (audience=npm) =="
          RESP="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm")"

          TOKEN="$(node -e "const r=JSON.parse(process.argv[1]); console.log(r.value || '');" "$RESP")"
          export TOKEN

          if [ -z "$TOKEN" ]; then
            echo "Failed to get OIDC token. Response:"
            echo "$RESP"
            exit 1
          fi

          echo "== Decoding JWT claims (safe, no signature verification) =="
          node - <<'NODE'
          const token = process.env.TOKEN;

          const parts = token.split(".");
          if (parts.length !== 3) {
            console.error("Not a JWT");
            process.exit(1);
          }

          function b64urlToJson(b64url) {
            const b64 = b64url.replace(/-/g, "+").replace(/_/g, "/");
            const pad = "=".repeat((4 - (b64.length % 4)) % 4);
            return JSON.parse(Buffer.from(b64 + pad, "base64").toString("utf8"));
          }

          const header = b64urlToJson(parts[0]);
          const payload = b64urlToJson(parts[1]);

          console.log("JWT header:");
          console.log(JSON.stringify(header, null, 2));
          console.log("\nJWT payload claims:");
          console.log(JSON.stringify(payload, null, 2));

          console.log("\n--- KEY CLAIMS npm cares about ---");
          console.log("iss:", payload.iss);
          console.log("aud:", payload.aud);
          console.log("sub:", payload.sub);
          console.log("repository:", payload.repository);
          console.log("ref:", payload.ref);
          console.log("workflow:", payload.workflow);
          console.log("job_workflow_ref:", payload.job_workflow_ref);
          console.log("environment:", payload.environment);
          NODE

      - name: Publish
        run: npm publish --access public --provenance
